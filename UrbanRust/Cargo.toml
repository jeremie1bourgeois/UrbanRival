[package]
name = "ur-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

# Le round reste sans dépendance : rien à compiler, rien à charger dans le chemin chaud. Seule la recherche répartit
# son travail sur les cœurs, avec rayon (docs/MOTEUR-RUST.md).
[dependencies]
rayon = "1"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

# Les tests relisent tout le corpus (~110 Mo de JSON) : sans optimisation, `tests/lecture_corpus.rs` prend 35 s ;
# avec les dépendances en -O3 et la crate en -O1 (le JSON générique s'y compile), 5 s.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Un moteur dont la raison d'être est la vitesse se profile : les tables de lignes ne coûtent rien à l'exécution.
debug = "line-tables-only"
