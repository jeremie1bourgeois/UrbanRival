[package]
name = "ur-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

# Le moteur lui-même reste sans dépendance : rien à compiler, rien à charger dans le chemin chaud.
[dependencies]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Un moteur dont la raison d'être est la vitesse se profile : les tables de lignes ne coûtent rien à l'exécution.
debug = "line-tables-only"
